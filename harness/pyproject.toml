[project]
name = "ec2bench"
version = "0.1.0"
description = "Tag-scoped EC2 benchmark fleet: launch, SSH, isolate, and expire boxes."
readme = "README.md"
requires-python = ">=3.15"
license = "MIT"
dependencies = ["boto3>=1.40", "click>=8.5", "rich>=15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ec2bench"]
